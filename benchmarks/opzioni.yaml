schema_version: 1
common:
  solvers:
  - cp_sat
  - gurobi
  capacity: 15
  forklift_weight: 0.3333333333333333
  limit_per_depot_s: 0.5
  objective_scale: 10000
  solver_threads: 1
  seed: 0
  estimates:
    update: average
    reset_generation: 0
scenarios:
  tecnica:
    methods:
      Basic:
      - 1d
    processes: 1
  pilota:
    methods:
      Basic:
      - 1d
      - 2d
      ZoomIn:
      - 1d
      - 2d
    processes: 2
  basic_2d:
    methods:
      Basic:
      - 2d
    processes: 2
  completo:
    methods:
      Basic:
      - 1d
      - 2d
      ZoomIn:
      - 1d
      - 2d
    processes: 2
search:
  basic_step_m: 1.0
  zoom_initial_step_m: 2.0
  zoom_minimum_step_m: 0.4
  zoom_reduction: 5
second_limit_policy:
  trigger: Decide and record before full runs if pilot shows substantial or solver-asymmetric FEASIBLE / TIME_LIMIT_NO_SOLUTION
    rates
  proposed_limit_per_depot_s: 3.0
  enabled: false
